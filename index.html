<!DOCTYPE html>
<html>
<head>
  <title>Screen Share App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Screen Share</h2>

  <input id="room" placeholder="Room name">
  <button onclick="startSharing()">Start Sharing</button>
  <button onclick="join()">Join</button>

  <p id="status">Idle</p>

  <br><br>
  <video id="video" autoplay playsinline controls style="width:600px;"></video>

<script>
const SUPABASE_URL = "https://tvdrhuwhrazvoegsxykb.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYeHsv6kmk2KETnhYNapAg_Zc6j8LDi";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let pc;
let room;
let localStream;

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}

function createPeerConnection() {
  const pc = new RTCPeerConnection();

  pc.ontrack = (event) => {
    document.getElementById("video").srcObject = event.streams[0];
  };

  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      await supabaseClient.from("signals").insert({
        room,
        type: "candidate",
        data: event.candidate
      });
    }
  };

  return pc;
}

async function startSharing() {
  try {
    room = document.getElementById("room").value;
    if (!room) return alert("Enter a room name");

    setStatus("Starting screen share...");

    pc = createPeerConnection();

    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    document.getElementById("video").srcObject = localStream;

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await supabaseClient.from("signals").insert({
      room,
      type: "offer",
      data: offer
    });

    setStatus("Waiting for viewer...");

    // 🔁 WAIT FOR ANSWER
    const waitAnswer = setInterval(async () => {
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("type", "answer")
        .order("created_at", { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        clearInterval(waitAnswer);

        await pc.setRemoteDescription(
          new RTCSessionDescription(data[0].data)
        );

        setStatus("Viewer connected!");
      }
    }, 1000);

    // 🔁 RECEIVE CANDIDATES
    setInterval(async () => {
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("type", "candidate");

      data.forEach(async (c) => {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c.data));
        } catch {}
      });
    }, 2000);

  } catch (err) {
    alert("ERROR: " + err.message);
    setStatus("Error: " + err.message);
  }
}

async function join() {
  try {
    room = document.getElementById("room").value;
    if (!room) return alert("Enter a room name");

    setStatus("Searching for host...");

    pc = createPeerConnection();

    // 🔁 WAIT FOR OFFER
    const waitOffer = setInterval(async () => {
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("type", "offer")
        .order("created_at", { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        clearInterval(waitOffer);

        setStatus("Host found! Connecting...");

        await pc.setRemoteDescription(
          new RTCSessionDescription(data[0].data)
        );

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await supabaseClient.from("signals").insert({
          room,
          type: "answer",
          data: answer
        });
      }
    }, 1000);

    // 🔁 RECEIVE CANDIDATES
    setInterval(async () => {
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("type", "candidate");

      data.forEach(async (c) => {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c.data));
        } catch {}
      });
    }, 2000);

  } catch (err) {
    alert("ERROR: " + err.message);
    setStatus("Error: " + err.message);
  }
}
</script>
</body>
</html>
