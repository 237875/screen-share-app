<!DOCTYPE html>
<html>
<head>
  <title>Screen Share App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Screen Share</h2>

  <input id="room" placeholder="Room name">
  <button onclick="startSharing()">Start Sharing</button>
  <button onclick="join()">Join</button>

  <p id="status">Idle</p>

  <br><br>
  <video id="video" autoplay playsinline controls style="width:600px;"></video>

<script>
const SUPABASE_URL = "https://tvdrhuwhrazvoegsxykb.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYeHsv6kmk2KETnhYNapAg_Zc6j8LDi";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let pc;
let room;
let sessionId;
let localStream;

const seenCandidates = new Set();

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

// 🔥 STUN + TURN (critical for cross-network video)
function createPC(){
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  });

  pc.ontrack = (event) => {
    console.log("TRACK RECEIVED");
    const video = document.getElementById("video");
    video.srcObject = event.streams[0];
    video.play().catch(()=>{});
  };

  pc.onicecandidate = async (event) => {
    if (event.candidate && sessionId) {
      await supabaseClient.from("signals").insert({
        room,
        session: sessionId,
        type: "candidate",
        data: event.candidate,
        updated_at: new Date().toISOString()
      });
    }
  };

  return pc;
}

// 🔴 HOST
async function startSharing(){
  try{
    room = document.getElementById("room").value;
    if(!room) return alert("Enter room");

    sessionId = Date.now().toString();
    pc = createPC();

    setStatus("Requesting screen...");

    localStream = await navigator.mediaDevices.getDisplayMedia({ video:true });
    document.getElementById("video").srcObject = localStream;

    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });

    await new Promise(r => setTimeout(r, 300));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await supabaseClient.from("signals").insert({
      room,
      session: sessionId,
      type: "offer",
      data: offer,
      updated_at: new Date().toISOString()
    });

    setStatus("Waiting for viewer...");

    // answer loop
    setInterval(async ()=>{
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("session", sessionId)
        .eq("type","answer")
        .limit(1);

      if(data && data.length && !pc.currentRemoteDescription){
        await pc.setRemoteDescription(new RTCSessionDescription(data[0].data));
        setStatus("Viewer connected!");
      }
    },1000);

    // candidates (deduped)
    setInterval(async ()=>{
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("session", sessionId)
        .eq("type","candidate");

      for(const c of (data||[])){
        const key = JSON.stringify(c.data);
        if(seenCandidates.has(key)) continue;
        seenCandidates.add(key);

        try{
          await pc.addIceCandidate(new RTCIceCandidate(c.data));
        }catch(e){}
      }
    },1000);

  }catch(e){
    alert(e.message);
  }
}

// 🔵 VIEWER
async function join(){
  try{
    room = document.getElementById("room").value;
    if(!room) return alert("Enter room");

    pc = createPC();
    setStatus("Searching for host...");

    const find = setInterval(async ()=>{
      const { data } = await supabaseClient
        .from("signals")
        .select("*")
        .eq("room", room)
        .eq("type","offer")
        .order("created_at",{ascending:false})
        .limit(1);

      if(data && data.length){
        clearInterval(find);

        sessionId = data[0].session;

        await pc.setRemoteDescription(new RTCSessionDescription(data[0].data));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await supabaseClient.from("signals").insert({
          room,
          session: sessionId,
          type:"answer",
          data: answer,
          updated_at: new Date().toISOString()
        });

        setStatus("Connected! Receiving video...");

        startCandidates();
      }
    },1000);

  }catch(e){
    alert(e.message);
  }
}

// 🔵 VIEWER candidates
function startCandidates(){
  setInterval(async ()=>{
    if(!sessionId) return;

    const { data } = await supabaseClient
      .from("signals")
      .select("*")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","candidate");

    for(const c of (data||[])){
      const key = JSON.stringify(c.data);
      if(seenCandidates.has(key)) continue;
      seenCandidates.add(key);

      try{
        await pc.addIceCandidate(new RTCIceCandidate(c.data));
      }catch(e){}
    }
  },1000);
}
</script>
</body>
</html>
