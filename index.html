<!DOCTYPE html>
<html>
<head>
  <title>Screen Share App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Screen Share</h2>

  <input id="room" placeholder="Room name">
  <button onclick="startSharing()">Start Sharing</button>
  <button onclick="join()">Join</button>

  <p id="status">Idle</p>

  <br><br>
  <video id="video" autoplay playsinline controls style="width:600px;"></video>

<script>
const SUPABASE_URL = "https://tvdrhuwhrazvoegsxykb.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYeHsv6kmk2KETnhYNapAg_Zc6j8LDi";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let pc, room, sessionId, localStream;
let heartbeat, staleCheck;

const HEARTBEAT_MS = 2000;
const STALE_MS = 8000;

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

// ✅ STUN + TURN (CRITICAL FIX)
function createPeerConnection(){
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  });

  pc.ontrack = e => {
    document.getElementById("video").srcObject = e.streams[0];
  };

  pc.onicecandidate = async e => {
    if (e.candidate && sessionId) {
      await supabaseClient.from("signals").insert({
        room,
        session: sessionId,
        type: "candidate",
        data: e.candidate,
        updated_at: new Date().toISOString()
      });
    }
  };

  return pc;
}

// 🔴 HOST
async function startSharing(){
  try{
    room = document.getElementById("room").value;
    if(!room) return alert("Enter room");

    sessionId = Date.now().toString();
    pc = createPeerConnection();

    setStatus("Requesting screen...");

    localStream = await navigator.mediaDevices.getDisplayMedia({ video:true });
    document.getElementById("video").srcObject = localStream;

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await supabaseClient.from("signals").insert({
      room,
      session: sessionId,
      type: "offer",
      data: offer,
      updated_at: new Date().toISOString()
    });

    setStatus("Waiting for viewer...");

    // 💓 heartbeat
    heartbeat = setInterval(async ()=>{
      await supabaseClient.from("signals")
        .update({ updated_at: new Date().toISOString() })
        .eq("room", room)
        .eq("session", sessionId)
        .eq("type","offer");
    }, HEARTBEAT_MS);

    // wait answer
    setInterval(async ()=>{
      const {data} = await supabaseClient.from("signals")
        .select("*")
        .eq("room", room)
        .eq("session", sessionId)
        .eq("type","answer")
        .limit(1);

      if(data && data.length && !pc.currentRemoteDescription){
        await pc.setRemoteDescription(new RTCSessionDescription(data[0].data));
        setStatus("Viewer connected!");
      }
    },1000);

    // candidates
    setInterval(async ()=>{
      const {data} = await supabaseClient.from("signals")
        .select("*")
        .eq("room", room)
        .eq("session", sessionId)
        .eq("type","candidate");

      (data||[]).forEach(async c=>{
        try{ await pc.addIceCandidate(new RTCIceCandidate(c.data)); }catch{}
      });
    },1500);

  }catch(e){
    alert(e.message);
  }
}

// 🔵 VIEWER
async function join(){
  try{
    room = document.getElementById("room").value;
    if(!room) return alert("Enter room");

    pc = createPeerConnection();
    setStatus("Searching for host...");

    const find = setInterval(async ()=>{
      const {data} = await supabaseClient.from("signals")
        .select("*")
        .eq("room", room)
        .eq("type","offer")
        .order("created_at",{ascending:false})
        .limit(1);

      if(data && data.length){
        clearInterval(find);

        sessionId = data[0].session;

        await pc.setRemoteDescription(new RTCSessionDescription(data[0].data));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await supabaseClient.from("signals").insert({
          room,
          session: sessionId,
          type:"answer",
          data: answer,
          updated_at: new Date().toISOString()
        });

        setStatus("Connected! Receiving video...");

        watchCandidates();
        watchDisconnect();
      }
    },1000);

  }catch(e){
    alert(e.message);
  }
}

function watchCandidates(){
  setInterval(async ()=>{
    if(!sessionId) return;

    const {data} = await supabaseClient.from("signals")
      .select("*")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","candidate");

    (data||[]).forEach(async c=>{
      try{ await pc.addIceCandidate(new RTCIceCandidate(c.data)); }catch{}
    });
  },1500);
}

// 🧠 detect host disconnect
function watchDisconnect(){
  staleCheck = setInterval(async ()=>{
    const {data} = await supabaseClient.from("signals")
      .select("updated_at")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","offer")
      .limit(1);

    if(!data || !data.length){
      disconnect("Host gone");
      return;
    }

    const last = new Date(data[0].updated_at).getTime();
    if(Date.now() - last > STALE_MS){
      disconnect("Host disconnected");
    }
  },2000);
}

function disconnect(msg){
  clearInterval(staleCheck);
  try{ pc.close(); }catch{}
  document.getElementById("video").srcObject = null;
  setStatus(msg);
}

// cleanup
window.addEventListener("beforeunload", async ()=>{
  try{
    if(room && sessionId){
      await supabaseClient.from("signals")
        .delete()
        .eq("room", room)
        .eq("session", sessionId);
    }
  }catch{}
});
</script>
</body>
</html>
