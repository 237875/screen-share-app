<!DOCTYPE html>
<html>
<head>
  <title>Screen Share Fixed</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Screen Share</h2>

  <input id="room" placeholder="Room name">
  <button onclick="start()">Start Sharing</button>
  <button onclick="join()">Join</button>

  <p id="status">Idle</p>

  <video id="video" autoplay playsinline controls style="width:600px;"></video>

<script>
const supabaseClient = supabase.createClient(
  "https://tvdrhuwhrazvoegsxykb.supabase.co",
  "sb_publishable_TYeHsv6kmk2KETnhYNapAg_Zc6j8LDi"
);

let pc;
let room;
let sessionId;
let stream;

const seen = new Set();

function status(t){
  document.getElementById("status").innerText = t;
}

// 🔥 CLEAN WebRTC config
function makePC(){
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  });

  pc.ontrack = (e)=>{
    document.getElementById("video").srcObject = e.streams[0];
  };

  // 🚨 SEND ICE ONLY ONCE (NO DB FLOODING ISSUES)
  pc.onicecandidate = async (e)=>{
    if(!e.candidate) return;

    await supabaseClient.from("signals").insert({
      room,
      session: sessionId,
      type: "candidate",
      data: e.candidate,
      updated_at: new Date().toISOString()
    });
  };

  return pc;
}

// 🔴 HOST
async function start(){
  room = document.getElementById("room").value;
  if(!room) return alert("Enter room");

  sessionId = Date.now().toString();
  pc = makePC();

  status("Starting screen share...");

  stream = await navigator.mediaDevices.getDisplayMedia({video:true});
  document.getElementById("video").srcObject = stream;

  stream.getTracks().forEach(t=>pc.addTrack(t, stream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await supabaseClient.from("signals").insert({
    room,
    session: sessionId,
    type: "offer",
    data: offer
  });

  status("Waiting for viewer...");

  // answer listener (NO ICE HERE ANYMORE)
  setInterval(async ()=>{
    const {data} = await supabaseClient
      .from("signals")
      .select("*")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","answer")
      .limit(1);

    if(data?.length && !pc.currentRemoteDescription){
      await pc.setRemoteDescription(
        new RTCSessionDescription(data[0].data)
      );

      status("Viewer connected!");
    }
  },1000);

  // 🔥 ONLY APPLY NEW CANDIDATES (NO REPEATS)
  setInterval(async ()=>{
    const {data} = await supabaseClient
      .from("signals")
      .select("*")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","candidate");

    for(const c of (data||[])){
      const id = JSON.stringify(c.data);
      if(seen.has(id)) continue;
      seen.add(id);

      try{
        await pc.addIceCandidate(new RTCIceCandidate(c.data));
      }catch{}
    }
  },1000);
}

// 🔵 VIEWER
async function join(){
  room = document.getElementById("room").value;
  if(!room) return alert("Enter room");

  pc = makePC();

  status("Searching...");

  const find = setInterval(async ()=>{
    const {data} = await supabaseClient
      .from("signals")
      .select("*")
      .eq("room", room)
      .eq("type","offer")
      .order("created_at",{ascending:false})
      .limit(1);

    if(data?.length){
      clearInterval(find);

      sessionId = data[0].session;

      await pc.setRemoteDescription(
        new RTCSessionDescription(data[0].data)
      );

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await supabaseClient.from("signals").insert({
        room,
        session: sessionId,
        type:"answer",
        data: answer
      });

      status("Connected!");

      listenCandidates();
    }
  },1000);
}

// 🔵 VIEWER candidate listener (NO POLLING LOOP SPAM)
function listenCandidates(){
  setInterval(async ()=>{
    const {data} = await supabaseClient
      .from("signals")
      .select("*")
      .eq("room", room)
      .eq("session", sessionId)
      .eq("type","candidate");

    for(const c of (data||[])){
      const id = JSON.stringify(c.data);
      if(seen.has(id)) continue;
      seen.add(id);

      try{
        await pc.addIceCandidate(new RTCIceCandidate(c.data));
      }catch{}
    }
  },1000);
}
</script>
</body>
</html>
